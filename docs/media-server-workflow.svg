<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 1000" role="img" aria-labelledby="title desc">
  <title id="title">Pi-flix media workflow</title>
  <desc id="desc">A boundary diagram showing the public services, private home network, Raspberry Pi services, downloads, library, and TV playback.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e8eef7"/>
    </linearGradient>
    <linearGradient id="pi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#effcf4"/>
      <stop offset="1" stop-color="#e4f5ec"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#18243a" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#52627a"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3275a9"/>
    </marker>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #17243a; }
      .title { font-size: 34px; font-weight: 750; letter-spacing: -.5px; }
      .subtitle { font-size: 16px; fill: #58677e; }
      .boundary-title { font-size: 17px; font-weight: 750; letter-spacing: 1.4px; }
      .node-title { font-size: 19px; font-weight: 700; }
      .node-sub { font-size: 14px; fill: #53647a; }
      .flow-label { font-size: 13px; font-weight: 650; fill: #46556b; }
      .node { filter: url(#shadow); }
      .flow { fill: none; stroke: #52627a; stroke-width: 2.6; marker-end: url(#arrow); }
      .sync { fill: none; stroke: #3275a9; stroke-width: 2.4; stroke-dasharray: 7 6; marker-start: url(#arrowBlue); marker-end: url(#arrowBlue); }
    </style>
  </defs>

  <rect width="1680" height="1000" rx="30" fill="url(#bg)"/>
  <text x="48" y="58" class="title">Pi-flix · media workflow</text>
  <text x="50" y="88" class="subtitle">Where services run and how a request becomes something to watch</text>

  <!-- Trust and location boundaries -->
  <rect x="38" y="125" width="354" height="825" rx="24" fill="#f2f5fa" stroke="#8290a5" stroke-width="2.5"/>
  <text x="64" y="163" class="boundary-title" fill="#44536a">🌐 PUBLIC SERVICES</text>

  <rect x="420" y="125" width="1222" height="825" rx="24" fill="#edf8fb" stroke="#4c9cb0" stroke-width="2.5"/>
  <text x="446" y="163" class="boundary-title" fill="#247286">🏠 PRIVATE HOME NETWORK</text>

  <rect x="448" y="194" width="835" height="710" rx="22" fill="url(#pi)" stroke="#4c9c70" stroke-width="2.5"/>
  <text x="474" y="232" class="boundary-title" fill="#267348">🥧 RASPBERRY PI</text>

  <rect x="470" y="260" width="430" height="445" rx="18" fill="#f7fcf8" stroke="#85b89a" stroke-width="1.8"/>
  <text x="492" y="291" class="boundary-title" fill="#47765a" style="font-size:13px;letter-spacing:1px">🐳 DOCKER · arr_arr NETWORK</text>

  <rect x="920" y="442" width="335" height="235" rx="18" fill="#fffaf0" stroke="#d6ad58" stroke-width="1.8"/>
  <text x="942" y="473" class="boundary-title" fill="#866318" style="font-size:13px;letter-spacing:1px">💾 PI STORAGE · /srv/data</text>

  <rect x="70" y="200" width="290" height="186" rx="18" fill="#fff" stroke="#a9b5c7" stroke-width="1.5"/>
  <text x="92" y="229" class="boundary-title" fill="#53647a" style="font-size:12px;letter-spacing:1px">CLIENT + CLOUD</text>

  <!-- Nodes -->
  <g class="node">
    <rect x="94" y="246" width="242" height="54" rx="13" fill="#e8eef8" stroke="#899ab5"/>
    <text x="215" y="280" text-anchor="middle" class="node-title">📱 Phone</text>

    <rect x="94" y="319" width="242" height="54" rx="13" fill="#eeeaff" stroke="#9182d2"/>
    <text x="215" y="353" text-anchor="middle" class="node-title">☁️ Cloudflare</text>

    <rect x="70" y="448" width="290" height="92" rx="18" fill="#fff" stroke="#a9b5c7" stroke-width="1.5"/>
    <text x="92" y="481" class="node-title">✨ TMDb + OpenAI</text>
    <text x="92" y="510" class="node-sub">Chat and title details</text>

    <rect x="70" y="716" width="290" height="92" rx="18" fill="#fff" stroke="#a9b5c7" stroke-width="1.5"/>
    <text x="92" y="750" class="node-title">🔎 Legal indexers</text>
    <text x="92" y="779" class="node-sub">Search sources managed by Prowlarr</text>

    <rect x="492" y="313" width="386" height="64" rx="14" fill="#e7f4ff" stroke="#6ea4c9" stroke-width="1.6"/>
    <text x="685" y="340" text-anchor="middle" class="node-title">💬 Watchlist</text>
    <text x="685" y="362" text-anchor="middle" class="node-sub">Chat and list</text>

    <rect x="492" y="414" width="386" height="64" rx="14" fill="#e8f7ee" stroke="#72b18a" stroke-width="1.6"/>
    <text x="685" y="441" text-anchor="middle" class="node-title">🎞️ Radarr · movies</text>
    <text x="685" y="463" text-anchor="middle" class="node-sub">📺 Sonarr · TV</text>

    <rect x="492" y="515" width="386" height="64" rx="14" fill="#e8f7ee" stroke="#72b18a" stroke-width="1.6"/>
    <text x="685" y="542" text-anchor="middle" class="node-title">🗂️ Prowlarr</text>
    <text x="685" y="564" text-anchor="middle" class="node-sub">Indexer list and search routing</text>

    <rect x="492" y="616" width="386" height="64" rx="14" fill="#e8f7ee" stroke="#72b18a" stroke-width="1.6"/>
    <text x="685" y="643" text-anchor="middle" class="node-title">⬇️ qBittorrent</text>
    <text x="685" y="665" text-anchor="middle" class="node-sub">Downloads stop when complete</text>

    <rect x="944" y="490" width="287" height="62" rx="13" fill="#fff3d6" stroke="#d5ad57" stroke-width="1.5"/>
    <text x="1087" y="528" text-anchor="middle" class="node-title">📥 Torrents</text>

    <rect x="944" y="574" width="287" height="78" rx="13" fill="#fff3d6" stroke="#d5ad57" stroke-width="1.5"/>
    <text x="1087" y="607" text-anchor="middle" class="node-title">📚 Media library</text>
    <text x="1087" y="632" text-anchor="middle" class="node-sub">movies / shows</text>

    <rect x="944" y="744" width="287" height="82" rx="15" fill="#e7f3ff" stroke="#6ea4c9" stroke-width="1.6"/>
    <text x="1087" y="780" text-anchor="middle" class="node-title">🎬 Jellyfin</text>
    <text x="1087" y="805" text-anchor="middle" class="node-sub">Reads the library · streams to TV</text>

    <rect x="1340" y="744" width="250" height="82" rx="15" fill="#e8eef8" stroke="#899ab5" stroke-width="1.6"/>
    <text x="1465" y="780" text-anchor="middle" class="node-title">📺 TV</text>
    <text x="1465" y="805" text-anchor="middle" class="node-sub">Home Wi-Fi</text>
  </g>

  <!-- Main connections -->
  <path d="M215 300 L215 319" class="flow"/>
  <path d="M336 346 C408 346 422 345 492 345" class="flow"/>
  <text x="405" y="330" class="flow-label">chat</text>

  <path d="M685 377 L685 414" class="flow"/>
  <text x="700" y="401" class="flow-label">request</text>
  <path d="M685 478 L685 515" class="flow"/>
  <text x="700" y="502" class="flow-label">search</text>
  <path d="M685 579 L685 616" class="flow"/>
  <text x="700" y="603" class="flow-label">grab</text>

  <path d="M492 345 C438 345 418 494 360 494" class="flow"/>
  <text x="382" y="426" class="flow-label" transform="rotate(-66 382 426)">metadata + AI</text>
  <path d="M492 547 C435 547 414 762 360 762" class="flow"/>
  <text x="381" y="679" class="flow-label" transform="rotate(-76 381 679)">searches</text>

  <path d="M878 648 L902 648 L902 521 L944 521" class="flow"/>
  <text x="908" y="640" class="flow-label">download</text>
  <path d="M1087 552 L1087 574" class="flow"/>
  <text x="1100" y="568" class="flow-label">import · hard link</text>
  <path d="M1087 652 L1087 744" class="flow"/>
  <text x="1100" y="706" class="flow-label">library scan</text>
  <path d="M1231 785 L1340 785" class="flow" marker-start="url(#arrow)"/>
  <text x="1284" y="766" text-anchor="middle" class="flow-label">browse / stream</text>

  <path d="M878 435 C900 435 900 535 878 535" class="sync"/>
  <text x="903" y="486" class="flow-label" transform="rotate(90 903 486)">indexer sync</text>

  <rect x="450" y="862" width="770" height="26" rx="13" fill="#dff1e5"/>
  <text x="835" y="880" text-anchor="middle" class="node-sub" style="font-weight:650">Downloads and library share /srv/data, so imports can be hard links.</text>
</svg>
