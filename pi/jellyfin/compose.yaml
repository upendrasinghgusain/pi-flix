# Jellyfin media server, home network only. Films and shows are in /srv/data/library.
services:
  jellyfin:
    image: jellyfin/jellyfin:12.1
    container_name: jellyfin
    user: "1000:1000"
    # Host networking lets the TV app discover the server automatically (UDP 7359).
    network_mode: host
    environment:
      JELLYFIN_PublishedServerUrl: http://192.168.1.40:8096
    volumes:
      - ./config:/config
      - ./cache:/cache
      # The one library: movies/ and shows/. Radarr and Sonarr (pi/arr) file into it, and so does
      # anything you copy in yourself. Inside Jellyfin it's /media, as it was in the Syncthing days,
      # so library paths and watch history carried over. Writable so you can delete what you've
      # watched (Dashboard > Users > Allow media deletion). Radarr imports by hard link, so the
      # space comes back once pi/arr/reclaim.py removes the seeding torrent too.
      - /srv/data/library:/media
    # Leave a core free for the risky-business stacks if a video needs transcoding.
    cpus: "3.0"
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
