# Prowlarr, Radarr, Sonarr and their own qBittorrent: the *arr pipeline, for learning how it works.
# Legal indexers only (the Internet Archive). Everything lives under /srv/data, one filesystem, so
# imports are hard links. Nothing seeds: a finished torrent stops, is imported, then removed (setup.py):
#   /srv/data/torrents                   downloads (qBittorrent categories "radarr" and "sonarr")
#   /srv/data/library/{movies,shows}     imported and renamed; the one folder Jellyfin shows
# Web pages listen on the Pi only; use an SSH tunnel.
x-common: &common
  restart: unless-stopped
  networks: [arr]
  environment: &env
    PUID: "1000"
    PGID: "1000"
    TZ: Europe/London
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: "3" }

services:
  prowlarr:
    <<: *common
    image: lscr.io/linuxserver/prowlarr:2.6.5.5623-ls162
    container_name: prowlarr
    volumes:
      - ./prowlarr:/config
    ports: ["127.0.0.1:9696:9696"]
    cpus: "0.5"

  radarr:
    <<: *common
    image: lscr.io/linuxserver/radarr:6.4.4.10685-ls318
    container_name: radarr
    volumes:
      - ./radarr:/config
      - /srv/data:/data
    ports: ["127.0.0.1:7878:7878"]
    cpus: "1.0"

  sonarr:
    <<: *common
    image: lscr.io/linuxserver/sonarr:4.0.20.3014-ls326
    container_name: sonarr
    volumes:
      - ./sonarr:/config
      - /srv/data:/data
    ports: ["127.0.0.1:8989:8989"]
    cpus: "1.0"

  qbittorrent:
    <<: *common
    image: lscr.io/linuxserver/qbittorrent:5.2.4_v2.0.15-ls479
    container_name: qbittorrent
    environment:
      <<: *env
      WEBUI_PORT: "8085"
      TORRENTING_PORT: "6881"
    volumes:
      - ./qbittorrent:/config
      - /srv/data/torrents:/data/torrents
    ports:
      - "127.0.0.1:8085:8085"
      # Peers on the home network can connect in; the router forwards nothing.
      - "6881:6881"
      - "6881:6881/udp"
    cpus: "1.0"

networks:
  arr:
